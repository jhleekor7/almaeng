spring:
  application:
    name: almaeng-api

server:
  port: 8080

almaeng:
  ai:
    # false면 Android 연동용 mock 데이터를 반환한다.
    # 실제 AI 생성 시 환경 변수로 설정한다.
    enabled: ${ALMAENG_AI_ENABLED:false}
    base-url: ${ALMAENG_AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${ALMAENG_AI_API_KEY:}
    model: ${ALMAENG_AI_MODEL:}
